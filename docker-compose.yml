services:
  backend:
    build:
      context: ./Backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      context: ./next-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000 # Change this to your EC2 Public IP or Domain
    depends_on:
      - backend
    restart: always
