services:
  backend:
    build:
      context: ./Backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      context: ./next-frontend
      args:
        - NEXT_PUBLIC_API_URL=http://16.16.97.129:5000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://16.16.97.129:5000
    depends_on:
      - backend
    restart: always
